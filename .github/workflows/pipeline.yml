name: Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mini-docker-page:${{ github.sha }} .

      - name: Run container smoke test
        run: |
          docker run -d --name app -p 8080:80 mini-docker-page:${{ github.sha }}
          sleep 2
          curl -fsS http://localhost:8080/ | grep -q "Hola, Jannin"
          docker stop app

  deploy-pages:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        run: |
          mkdir -p public
          cp index.html public/

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
