<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini página · Docker</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3dd6c3;
      --text: #e7ecf3;
      --muted: #8b9cb3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse 80% 60% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    main {
      background: var(--card);
      border: 1px solid rgba(61, 214, 195, 0.25);
      border-radius: 16px;
      padding: 2rem 2.25rem;
      max-width: 420px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p { color: var(--muted); line-height: 1.55; margin-bottom: 1.25rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(61, 214, 195, 0.12);
      color: var(--accent);
      font-size: 0.85rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-weight: 500;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot"></span> En línea</span>
    <h1>Hola, Jannin</h1>
    <p>
      Esta mini página se sirve con <strong>nginx</strong> dentro de un contenedor Docker.
      El pipeline en GitHub Actions construye la imagen en cada push.
    </p>
    <footer>Servido desde el contenedor · puerto 8080</footer>
  </main>
</body>
</html>
